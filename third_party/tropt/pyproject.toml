[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tropt"
version = "0.0.1a1"
description = "TROPT (early version) — discrete-text optimizer, vendored for TellTail-OPT"
requires-python = ">=3.10"
# Runtime deps (from the upstream 0.0.1a1 metadata, minus dev/evaluate extras).
dependencies = [
    "torch>=2.4.0",
    "tqdm",
    "jaxtyping",
    "numpy>=2.0.0",
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
    "hydra-core>=1.3.0",
    "omegaconf",
    "sentence-transformers>=5.1.0",
    "wandb",
    "livelossplot",
    "openai",
    "litellm",
    "ipython",
]

[tool.setuptools.packages.find]
include = ["tropt*"]
